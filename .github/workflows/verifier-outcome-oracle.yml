name: Pinned Dafny verifier-outcome differential

on:
  workflow_dispatch:
  push:
    branches: [research/verifier-mutability-context-2026-11-02]
    paths:
      - '.github/workflows/verifier-outcome-oracle.yml'
      - 'tests/dafny/ResearchVerificationOutcomeMethod.txt'
      - 'scripts/install_verifier_outcome_test.py'
      - 'scripts/compare_verification_outcomes.py'

jobs:
  verifier-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: prototype
      - uses: actions/checkout@v4
        with:
          repository: dafny-lang/dafny
          ref: de36f2ec1f9c530080eff7929ae28229f45da069
          submodules: recursive
          path: dafny
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned verifier tests and Z3
        run: |
          python3 prototype/scripts/install_verifier_outcome_test.py dafny/Source/DafnyLanguageServer.Test/Synchronization/VerificationStatusTest.cs
          (cd dafny && dotnet tool restore)
          sudo apt-get update -qq
          sudo apt-get install -y z3
          python3 prototype/scripts/compare_verification_outcomes.py --selftest
      - name: Build original Dafny language server tests
        working-directory: dafny
        run: dotnet build Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj -c Debug --nologo
      - name: Pinned-source context completeness audit
        run: >
          python3 prototype/scripts/audit_semantic_context.py
          --dafny dafny --research prototype --output research-results/source-context-audit.json

      - name: Test actual mutable result record aliasing
        working-directory: dafny
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~VerificationStatusTest.ResearchMutableResolutionResultAliasing'

      - name: Original verifier outcomes
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: original
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~VerificationStatusTest.ResearchVerificationOutcomeTrace'
      - name: Fresh parser and resolver verifier outcomes
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: fresh
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~VerificationStatusTest.ResearchVerificationOutcomeTrace'
      - name: Apply opt-in patches and semantic-only oracle
        run: |
          for index in 0001 0002 0003; do
            file=$(find prototype/patches -maxdepth 1 -type f -name "$index*.patch" -print -quit)
            test -n "$file"
            git -C dafny apply --check "../$file"
            git -C dafny apply "../$file"
          done
          git -C dafny diff --check
      - name: Build patched Dafny language server tests
        working-directory: dafny
        run: dotnet build Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj -c Debug --nologo
      - name: Parser-cached fresh semantic verifier outcomes
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: fresh-semantic
          DAFNY_RESEARCH_DISABLE_SEMANTIC_CACHE: '1'
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~VerificationStatusTest.ResearchVerificationOutcomeTrace'
      - name: Patched upstream baseline verifier outcomes
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: patched-baseline
          DAFNY_EXPERIMENTAL_CONTENT_HASH: '0'
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~VerificationStatusTest.ResearchVerificationOutcomeTrace'
      - name: Unsafe opt-in experimental verifier outcomes
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: experimental
          DAFNY_EXPERIMENTAL_CONTENT_HASH: '1'
          DAFNY_RESEARCH_UNSAFE_CROSS_REVISION_REUSE: '1'
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~VerificationStatusTest.ResearchVerificationOutcomeTrace'
      - name: Compare complete verifier outcomes, fail closed
        run: python3 prototype/scripts/compare_verification_outcomes.py research-results
      - name: Archive verifier traces including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dafny-verifier-outcome-differential
          path: research-results/
          if-no-files-found: warn
