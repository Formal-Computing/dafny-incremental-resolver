name: Dafny resolver integration

on:
  workflow_dispatch:

jobs:
  build-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
        with:
          path: prototype

      - name: Checkout pinned upstream Dafny
        uses: actions/checkout@v4
        with:
          repository: dafny-lang/dafny
          ref: de36f2ec1f9c530080eff7929ae28229f45da069
          submodules: recursive
          path: dafny

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install regression and differential tests
        run: |
          python3 prototype/scripts/install_integration_test.py dafny/Source/DafnyLanguageServer.Test/Synchronization/CachingTest.cs
          python3 prototype/scripts/install_differential_test.py dafny/Source/DafnyLanguageServer.Test/Synchronization/CachingTest.cs

      - name: Restore tools and install Z3
        run: |
          (cd dafny && dotnet tool restore)
          sudo apt-get update -qq
          sudo apt-get install -y z3

      - name: Build unmodified upstream
        working-directory: dafny
        run: dotnet build Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj -c Debug --nologo

      - name: Unmodified upstream differential traces
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: original
          DAFNY_EXPERIMENTAL_CONTENT_HASH: '0'
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~CachingTest.ResearchDifferentialTrace|FullyQualifiedName~CachingTest.ResearchPersistentEditLatency'

      - name: Fresh, non-caching semantic oracle
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: fresh
          DAFNY_EXPERIMENTAL_CONTENT_HASH: '0'
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~CachingTest.ResearchDifferentialTrace|FullyQualifiedName~CachingTest.ResearchPersistentEditLatency'

      - name: Apply experiment patch
        run: |
          git -C dafny apply --check ../prototype/patches/0001-experimental-module-token-hashing.patch
          git -C dafny apply ../prototype/patches/0001-experimental-module-token-hashing.patch
          git -C dafny diff --check

      - name: Build patched language-server tests
        working-directory: dafny
        run: dotnet build Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj -c Debug --nologo

      - name: Patched baseline differential traces and cache regression
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: patched-baseline
          DAFNY_EXPERIMENTAL_CONTENT_HASH: '0'
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~CachingTest.ResearchDifferentialTrace|FullyQualifiedName~CachingTest.SameFileIndependentModuleEdit|FullyQualifiedName~CachingTest.ResearchPersistentEditLatency'

      - name: Experimental differential traces and cache regression
        working-directory: dafny
        env:
          DAFNY_RESEARCH_MODE: experimental
          DAFNY_EXPERIMENTAL_CONTENT_HASH: '1'
          DAFNY_RESEARCH_OUTPUT_DIR: ${{ github.workspace }}/research-results
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~CachingTest.ResearchDifferentialTrace|FullyQualifiedName~CachingTest.SameFileIndependentModuleEdit|FullyQualifiedName~CachingTest.ResearchPersistentEditLatency'

      - name: Compare diagnostics to fresh oracle
        run: python3 prototype/scripts/compare_differential.py research-results

      - name: Summarize exploratory persistent-LSP update timing
        run: python3 prototype/scripts/summarize_benchmark.py research-results

      - name: Calibrate differential oracle on intentionally corrupted diagnostics
        run: python3 prototype/scripts/calibrate_differential.py research-results

      - name: Upstream caching regression suite
        working-directory: dafny
        env:
          DAFNY_EXPERIMENTAL_CONTENT_HASH: '1'
        run: >
          dotnet test Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj
          --no-build -c Debug --nologo
          --filter 'FullyQualifiedName~CachingTest&FullyQualifiedName!~ResearchDifferentialTrace&FullyQualifiedName!~ResearchPersistentEditLatency&FullyQualifiedName!~SameFileIndependentModuleEdit'

      - name: C# reference-model checks
        working-directory: prototype
        run: dotnet run --project tests/IncrementalResolver.SmokeTests/IncrementalResolver.SmokeTests.csproj

      - name: Save diagnostic traces, including failing cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dafny-research-traces-${{ github.sha }}
          path: research-results/
          if-no-files-found: warn
